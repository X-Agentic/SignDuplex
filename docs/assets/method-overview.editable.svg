<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1230" viewBox="0 0 1040 1230" role="img" aria-labelledby="title description"><title id="title">SignDuplex proposed method: causal dual RGB–Pose event prediction</title><desc id="description">Only observed RGB frames are used. The RGB pathway applies a SigLIP vision encoder and visual resampler. The parallel pose pathway applies RTMPose, an ST-GCN encoder, a Temporal Adapter, and a Projector. The current receiving or responding state is embedded. RGB, pose, and state tokens are concatenated and modeled by Qwen3-0.6B with LoRA. A unified five-class head predicts REJECT, INCOMPLETE, WAIT, COMPLETE, or BARGE. Based on final paper Fig. 3 and Section 3.2.</desc><metadata>{&quot;source&quot;: &quot;SignDuplex final paper, 20260924065321_895159_10552.pdf&quot;, &quot;text_rendering&quot;: &quot;editable native SVG text&quot;, &quot;figure_data&quot;: {&quot;source&quot;: &quot;Figure 3 / Section 3.2&quot;, &quot;update_interval_seconds&quot;: 1, &quot;backbone&quot;: &quot;Qwen3-0.6B&quot;, &quot;adaptation&quot;: &quot;LoRA&quot;, &quot;event_classes&quot;: [&quot;REJECT&quot;, &quot;INCOMPLETE&quot;, &quot;WAIT&quot;, &quot;COMPLETE&quot;, &quot;BARGE&quot;], &quot;input_policy&quot;: &quot;Only video frames observed so far&quot;}, &quot;visible_labels&quot;: [{&quot;label&quot;: &quot;PROPOSED METHOD&quot;, &quot;font_size&quot;: 24}, {&quot;label&quot;: &quot;Dual RGB–Pose event prediction&quot;, &quot;font_size&quot;: 42}, {&quot;label&quot;: &quot;Causal visual input + current system state&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;Causal video prefix&quot;, &quot;font_size&quot;: 32}, {&quot;label&quot;: &quot;Frames available at the current update&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;System state&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;Receiving / Responding&quot;, &quot;font_size&quot;: 24}, {&quot;label&quot;: &quot;RGB pathway&quot;, &quot;font_size&quot;: 29}, {&quot;label&quot;: &quot;Pose pathway&quot;, &quot;font_size&quot;: 29}, {&quot;label&quot;: &quot;State pathway&quot;, &quot;font_size&quot;: 29}, {&quot;label&quot;: &quot;SigLIP&quot;, &quot;font_size&quot;: 32}, {&quot;label&quot;: &quot;Vision encoder&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;Visual resampler&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;RTMPose&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;ST-GCN encoder&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;Temporal Adapter&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;Projector&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;State embedding&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;RGB tokens&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;Pose tokens&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;State token&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;Token concatenation&quot;, &quot;font_size&quot;: 32}, {&quot;label&quot;: &quot;Qwen3-0.6B (LoRA)&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;Joint RGB + Pose + State modeling&quot;, &quot;font_size&quot;: 27}, {&quot;label&quot;: &quot;Unified five-class head&quot;, &quot;font_size&quot;: 32}, {&quot;label&quot;: &quot;REJECT&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;INCOMPLETE&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;WAIT&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;COMPLETE&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;BARGE&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;Paper Fig. 3 · streaming update every 1 s&quot;, &quot;font_size&quot;: 24}]}</metadata><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1040" height="1230" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="48" y="65" fill="#702082" font-size="24" font-weight="700" text-anchor="st