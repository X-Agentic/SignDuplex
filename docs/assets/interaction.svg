<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="716" viewBox="0 0 1600 716" role="img" aria-labelledby="title"><title id="title">Paper method: causal RGB and pose prefixes plus state tokens predict five events; COMPLETE generates a response and BARGE stops output.</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#fbf8fd"/><stop offset="1" stop-color="#fff7f7"/></linearGradient><linearGradient id="accent"><stop stop-color="#702082"/><stop offset="1" stop-color="#cf243b"/></linearGradient></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1600" height="716" rx="24" fill="#fcfafd" stroke="none"/><text x="56" y="65" font-size="20" fill="#702082" font-weight="700" text-anchor="start">FROM CONTINUOUS SIGNING TO TIMELY RESPONSE</text><text x="56" y="116" font-size="36" fill="#20162c" font-weight="600" text-anchor="start">Interaction timing, independently modeled.</text><text x="56" y="181" font-size="20" fill="#702082" font-weight="700" text-anchor="start">01</text><text x="102" y="183" font-size="27" fill="#20162c" font-weight="600" text-anchor="start">Perceive</text><text x="56" y="222" font-size="21" fill="#706879" font-weight="400" text-anchor="start">Causal video prefix</text><text x="567" y="181" font-size="20" fill="#702082" font-weight="700" text-anchor="start">02</text><text x="613" y="183" font-size="27" fill="#20162c" font-weight="600" text-anchor="start">Decide</text><text x="567" y="222" font-size="21" fill="#706879" font-weight="400" text-anchor="start">State-aware event prediction</text><text x="1078" y="181" font-size="20" fill="#702082" font-weight="700" text-anchor="start">03</text><text x="1124" y="183" font-size="27" fill="#20162c" font-weight="600" text-anchor="start">Act</text><text x="1078" y="222" font-size="21" fill="#706879" font-weight="400" text-anchor="start">Route to downstream tasks</text><rect x="56" y="252" width="410" height="96" rx="20" fill="#efe7f5" stroke="none"/><text x="82" y="291" font-size="24" fill="#702082" font-weight="600" text-anchor="start">RGB pathway</text><text x="82" y="325" font-size="21" fill="#706879" font-weight="400" text-anchor="start">Appearance · face · gaze</text><rect x="56" y="366" width="410" height="96" rx="20" fill="#eaf3f5" stroke="none"/><text x="82" y="405" font-size="24" fill="#286571" font-weight="600" text-anchor="start">Pose pathway</text><text x="82" y="439" font-size="21" fill="#706879" font-weight="400" text-anchor="start">Hands · motion · temporal cues</text><text x="56" y="510" font-size="23" fill="#706879" font-weight="400" text-anchor="start">+ current system state</text><path d="M477 355 L553 355" stroke="#702082" stroke-width="3" fill="none"/><path d="M544 349 L553 355 L544 361" fill="none" stroke="#702082" stroke-width="3"/><rect x="567" y="252" width="430" height="256" rx="20" fill="#fff" stroke="#ddcce7"/><text x="782" y="303" font-size="36" fill="#702082" font-weight="700" text-anchor="middle">SignDuplex</text><text x="782" y="345" font-size="21" fill="#706879" font-weight="400" text-anchor="middle">RGB + Pose + State tokens</text><path d="M600 368 L964 368" stroke="#e4dce9" stroke-width="2" fill="none"/><text x="782" y="410" font-size="24" fill="#20162c" font-weight="500" text-anchor="middle">Qwen3-0.6B · LoRA</text><text x="782" y="465" font-size="21" fill="#706879" font-weight="400" text-anchor="middle">Unified five-class event head</text><path d="M1008 355 L1064 355" stroke="#702082" stroke-width="3" fill="none"/><path d="M1055 349 L1064 355 L1055 361" fill="none" stroke="#702082" stroke-width="3"/><rect x="1078" y="252" width="466" height="88" rx="20" fill="#f0e8f6" stroke="none"/><text x="1102" y="286" font-size="21" fill="#702082" font-weight="700" text-anchor="start">KEEP RECEIVING</text><text x="1102" y="318" font-size="19" fill="#706879" font-weight="400" text-anchor="start">REJECT · INCOMPLETE · WAIT</text><rect x="1078" y="354" width="466" height="88" rx="20" fill="#ebf5ef" stroke="none"/><text x="1102" y="388" font-size="21" fill="#256256" font-weight="700" text-anchor="start">GENERATE RESPONSE</text><text x="1102" y="420" font-size="19" fill="#706879" font-weight="400" text-anchor="start">COMPLETE → SLT → LLM → TTS</text><rect x="1078" y="456" width="466" height="88" rx="20" fill="#fff0f1" stroke="none"/><text x="1102" y="490" font-size="21" fill="#cf243b" font-weight="700" text-anchor="start">STOP OUTPUT</text><text x="1102" y="522" font-size="19" fill="#706879" font-weight="400" text-anchor="start">BARGE → return to RECEIVING</text><path d="M56 581 L1544 581" stroke="#e4dce9" stroke-width="2" fill="none"/><text x="56" y="626" font-size="18" fill="#702082" font-weight="700" text-anchor="start">EVERY 1 SECOND</text><text x="357" y="626" font-size="21" fill="#706879" font-weight="400" text-anchor="start">Observe → predict → route. Restart input accumulation on state transition.</text><text x="56" y="675" font-size="24" fill="#20162c" font-weight="500" text-anchor="start">Visual perception continues while the system responds, enabling user interruption.</text></g></svg>