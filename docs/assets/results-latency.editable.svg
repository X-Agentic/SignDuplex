<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" role="img" aria-labelledby="title description"><title id="title">SignDuplex first segment submission time on continuous input</title><desc id="description">Final paper Table 4, continuous multi-sentence input. All strategies use the same Uni-Sign translation model. Mean first submission times in seconds: Offline 15.11, SL segmentation 6.48, Online CSLR/SLT 6.26, SignDuplex 5.99, ideal boundary reference 5.91. Lower is better. Time runs from first video frame until the first valid segment is submitted to the translator. SignDuplex reduces this time by 60.4 percent relative to Offline. The reference uses ground-truth sentence boundaries. Bar axes start at zero.</desc><metadata>{&quot;source&quot;: &quot;SignDuplex final paper, 20260924065321_895159_10552.pdf&quot;, &quot;text_rendering&quot;: &quot;editable native SVG text&quot;, &quot;figure_data&quot;: {&quot;source&quot;: &quot;Table 4, continuous multi-sentence input&quot;, &quot;metric&quot;: &quot;Mean first valid segment submission time&quot;, &quot;unit&quot;: &quot;seconds&quot;, &quot;axis_minimum&quot;: 0, &quot;axis_maximum&quot;: 16, &quot;values&quot;: {&quot;Offline&quot;: 15.11, &quot;SL segmentation&quot;: 6.48, &quot;Online CSLR/SLT&quot;: 6.26, &quot;SignDuplex&quot;: 5.99, &quot;Ideal boundary reference&quot;: 5.91}, &quot;reference_protocol&quot;: &quot;Ground-truth sentence boundaries; ideal boundary conditions&quot;, &quot;relative_change_vs_offline_percent&quot;: -60.4}, &quot;visible_labels&quot;: [{&quot;label&quot;: &quot;CONTINUOUS MULTI-SENTENCE INPUT&quot;, &quot;font_size&quot;: 24}, {&quot;label&quot;: &quot;First segment submission&quot;, &quot;font_size&quot;: 38}, {&quot;label&quot;: &quot;−60.4%&quot;, &quot;font_size&quot;: 36}, {&quot;label&quot;: &quot;vs. offline&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;Tfirst (s) ↓ · lower is faster&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;From first frame to valid segment submission&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;Offline&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;15.11&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;SL segmentation&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;6.48&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;Online CSLR/SLT&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;6.26&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;SignDuplex&quot;, &quot;font_size&quot;: 30}, {&quot;label&quot;: &quot;5.99&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;Ideal boundary&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;reference&quot;, &quot;font_size&quot;: 24}, {&quot;label&quot;: &quot;5.91&quot;, &quot;font_size&quot;: 34}, {&quot;label&quot;: &quot;0&quot;, &quot;font_size&quot;: 26}, {&quot;label&quot;: &quot;4&quot;, &quot;font_size&quot;: 26}, {&quot;label&quot;: &quot;8&quot;, &quot;font_size&quot;: 26}, {&quot;label&quot;: &quot;12&quot;, &quot;font_size&quot;: 26}, {&quot;label&quot;: &quot;16&quot;, &quot;font_size&quot;: 26}, {&quot;label&quot;: &quot;Reference uses ground-truth sentence boundaries.&quot;, &quot;font_size&quot;: 25}]}</metadata><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1040" height="770" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="48" y="65" fill="#c62642" font-size="24" font-weight="700" text-anchor="start">CONTINUOUS MULTI-SENTENCE INPUT</text><text x="48" y="126" fill="#24182e" font-size="38" font-weight="700" text-anchor="start">First segment submission</text><text x="992" y="125" fill="#c62642" font-size="36" font-weight="700" text-anchor="end">−60.4%</text><text x="992" y="168" fill="#6e6378" font-size="25" font-weight="400" text-anchor="end">vs. offline</text><text x="48" y="176" fill="#6e6378" font-size="28" font-weight="400" text-anchor="start">Tfirst (s) ↓ · lower is faster</text><text x="48" y="213" fill="#6e6378" font-size="25" font-weight="400" text-anchor="start">From first frame to valid segment submission</text><path d="M380.0 237 V663" fill="none" stroke="#eee8f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M515.0 237 V663" fill="none" stroke="#eee8f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.0 237 V663" fill="none" stroke="#eee8f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M785.0 237 V663" fill="none" stroke="#eee8f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M920.0 237 V663" fill="none" stroke="#eee8f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="279" fill="#24182e" font-size="30" font-weight="400" text-anchor="start">Offline</text><rect x="380" y="249" width="509.9625" height="40" rx="5" fill="#b9adbf" stroke="none" stroke-width="1.5"/><text x="904.9625" y="280" fill="#6e6378" font-size="34" font-weight="400" text-anchor="start">15.11</text><text x="48" y="360" fill="#24182e" font-size="30" font-weight="400" text-anchor="start">SL segmentation</text><rect x="380" y="330" width="218.70000000000002" height="40" rx="5" fill="#b9adbf" stroke="none" stroke-width="1.5"/><text x="613.7" y="361" fill="#6e6378" font-size="34" font-weight="400" text-anchor="start">6.48</text><text x="48" y="441" fill="#24182e" font-size="30" font-weight="400" text-anchor="start">Online CSLR/SLT</text><rect x="380" y="411" width="211.275" height="40" rx="5" fill="#b9adbf" stroke="none" stroke-width="1.5"/><text x="606.275" y="442" fill="#6e6378" font-size="34" font-weight="400" text-anchor="start">6.26</text><rect x="32" y="476" width="976" height="72" rx="12" fill="#fff0f3" stroke="none" stroke-width="1.5"/><text x="48" y="522" fill="#c62642" font-size="30" font-weight="700" text-anchor="start">SignDuplex</text><rect x="380" y="492" width="202.1625" height="40" rx="5" fill="#c62642" stroke="none" stroke-width="1.5"/><text x="597.1625" y="523" fill="#c62642" font-size="34" font-weight="700" text-anchor="start">5.99</text><text x="48" y="597" fill="#6e6378" font-size="28" font-weight="400" text-anchor="start">Ideal boundary</text><text x="48" y="628" fill="#6e6378" font-size="24" font-weight="400" text-anchor="start">reference</text><rect x="380" y="573" width="199.4625" height="40" rx="5" fill="#fff" stroke="#a48aaf" stroke-width="2" stroke-dasharray="7 5"/><text x="594.4625" y="604" fill="#6e6378" font-size="34" font-weight="400" text-anchor="start">5.91</text><path d="M380 663 H920" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M380.0 663 V670" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="380.0" y="701" fill="#6e6378" font-size="26" font-weight="400" text-anchor="middle">0</text><path d="M515.0 663 V670" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="515.0" y="701" fill="#6e6378" font-size="26" font-weight="400" text-anchor="middle">4</text><path d="M650.0 663 V670" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="650.0" y="701" fill="#6e6378" font-size="26" font-weight="400" text-anchor="middle">8</text><path d="M785.0 663 V670" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="785.0" y="701" fill="#6e6378" font-size="26" font-weight="400" text-anchor="middle">12</text><path d="M920.0 663 V670" fill="none" stroke="#aa9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="920.0" y="701" fill="#6e6378" font-size="26" font-weight="400" text-anchor="middle">16</text><text x="48" y="749" fill="#6e6378" font-size="25" font-weight="400" text-anchor="start">Reference uses ground-truth sentence boundaries.</text></g></svg>
