<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" role="img" aria-labelledby="title description"><title id="title">SignDuplex translation quality on continuous multi-sentence input</title><desc id="description">Final paper Table 4, continuous multi-sentence input. All strategies use the same Uni-Sign translation model. BLEU-4 values: Offline 8.20, SL segmentation 11.85, Online CSLR/SLT 10.90, SignDuplex 13.72, ideal boundary reference 14.38. Higher is better. SignDuplex improves BLEU-4 by 67.3 percent relative to Offline. The reference uses ground-truth sentence boundaries. Bar axes start at zero.</desc><metadata>{&quot;source&quot;: &quot;SignDuplex final paper, 20260924065321_895159_10552.pdf&quot;, &quot;text_rendering&quot;: &quot;editable native SVG text&quot;, &quot;figure_data&quot;: {&quot;source&quot;: &quot;Table 4, continuous multi-sentence input&quot;, &quot;metric&quot;: &quot;BLEU-4&quot;, &quot;unit&quot;: &quot;BLEU-4&quot;, &quot;axis_minimum&quot;: 0, &quot;axis_maximum&quot;: 16, &quot;values&quot;: {&quot;Offline&quot;: 8.2, &quot;SL segmentation&quot;: 11.85, &quot;Online CSLR/SLT&quot;: 10.9, &quot;SignDuplex&quot;: 13.72, &quot;Ideal boundary reference&quot;: 14.38}, &quot;reference_protocol&quot;: &quot;Ground-truth sentence boundaries; ideal boundary conditions&quot;, &quot;relative_change_vs_offline_percent&quot;: 67.3}, &quot;visible_labels&quot;: [{&quot;label&quot;: &quot;CONTINUOUS MULTI-SENTENCE INPUT&quot;, &quot;font_size&quot;: 24}, {&quot;label&quot;: &quot;Translation quality&quot;, &quot;font_size&quot;: 42}, {&quot;label&quot;: &quot;+67.3%&quot;, &quot;font_size&quot;: 36}, {&quot;label&quot;: &quot;vs. offline&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;BLEU-4 ↑ · higher is better&quot;, &quot;font_size&quot;: 28}, {&quot;label&quot;: &quot;Same Uni-Sign translator · paper Table 4&quot;, &quot;font_size&quot;: 25}, {&quot;label&quot;: &quot;Offline&quot;, &quot;font_size&